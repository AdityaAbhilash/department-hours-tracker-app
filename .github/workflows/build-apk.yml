name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore stable debug keystore
        # Keeps the same signing key across every CI run, so a new APK can
        # always be installed as an "update" over the previous one without
        # needing to uninstall first (Android blocks updates on signature
        # mismatch). Without this, Gradle would auto-generate a brand new
        # random debug key on every fresh runner.
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        env:
          VITE_BUILD_ID: ${{ github.sha }}-${{ github.run_number }}
        run: npm run build

      - name: Add Android platform (if not already present)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add exact-alarm permission for reliable reminders
        # Without this, Android 12+ silently downgrades every scheduled
        # notification to "inexact" \u2014 batched into occasional maintenance
        # windows instead of firing at the requested time. This is why short
        # reminders mostly seemed to work (small delay is invisible) while
        # long-scheduled ones were unreliable or never arrived. `cap add`
        # regenerates this manifest from scratch each time, so it has to be
        # re-added on every build rather than committed once.
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' "$MANIFEST"
          fi
          grep "SCHEDULE_EXACT_ALARM" "$MANIFEST"

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: department-hours-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
